<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Banner - Artesanías Mexicanas</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState } = React;

        function BannerGenerator() {
            const [generatedImage, setGeneratedImage] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);

            const generateImage = async () => {
                setLoading(true);
                setError(null);

                const prompt = `Create a photorealistic horizontal banner image (1920x600 pixels) for a Mexican handicrafts e-commerce website with these specific elements:

COMPOSITION:
- Wide horizontal rectangular format, perfect for website hero banner
- Warm, inviting atmosphere with natural golden-hour lighting streaming through an arched window
- Traditional Mexican artisan workshop table setting with authentic details

FOREGROUND ELEMENTS (left to right):
- Stack of vibrant Talavera pottery bowls with intricate blue, yellow, and green patterns
- Handwoven textiles draped naturally: colorful sarape with rainbow stripes, embroidered huipil
- Wooden carved alebrijes (fantastical creatures) in bright colors
- Traditional clay pots and vessels with ethnic designs
- Woven palm baskets with natural texture

CENTER FOCAL POINT:
- A beautifully rendered 3D turquoise/blue map of Mexico as a central decorative element
- The map should have a subtle dimensional quality, appearing as an artisan piece itself
- Small decorative elements suggesting delivery/shipping (tiny carts, pathways) in traditional style

BACKGROUND:
- Soft-focus traditional Mexican architecture: adobe walls in warm terracotta
- Colorful textiles hanging on walls (deep blues, magentas, oranges)
- Arched doorway or window with natural light
- Traditional Mexican atmosphere without being cluttered

COLOR PALETTE:
- Rich turquoise and cobalt blues
- Warm terracotta and burnt orange
- Vibrant magenta and fuchsia accents
- Natural wood tones
- Golden yellow highlights
- All colors should be saturated but photorealistic

LIGHTING & STYLE:
- Photorealistic 3D rendering quality
- Soft natural lighting with warm tones
- Subtle depth of field focusing on center items
- Professional product photography aesthetic
- High detail and texture on all artisan pieces

CRITICAL: Absolutely NO TEXT, NO LETTERS, NO WORDS anywhere in the image. Pure visual storytelling through artisan objects and the Mexican map.

The overall mood should be: welcoming, authentic Mexican craftsmanship, professional e-commerce quality, cultural celebration, trustworthy delivery service.`;

                try {
                    const response = await fetch("https://api.anthropic.com/v1/messages", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({
                            model: "claude-sonnet-4-20250514",
                            max_tokens: 1024,
                            messages: [{
                                role: "user",
                                content: prompt
                            }]
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`Error: ${response.status}`);
                    }

                    const data = await response.json();
                    
                    // Look for image in response
                    const imageBlock = data.content?.find(block => block.type === 'image');
                    if (imageBlock) {
                        setGeneratedImage(imageBlock.source.data);
                    } else {
                        setError("No se pudo generar la imagen. El API no devolvió una imagen.");
                    }
                } catch (err) {
                    setError(`Error al generar la imagen: ${err.message}`);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-orange-50 to-blue-50 p-8">
                    <div className="max-w-6xl mx-auto">
                        <div className="bg-white rounded-2xl shadow-2xl p-8">
                            <div className="text-center mb-8">
                                <h1 className="text-4xl font-bold text-gray-800 mb-2">
                                    🎨 Generador de Banner
                                </h1>
                                <h2 className="text-2xl text-orange-600 mb-4">
                                    Artesanías Mexicanas
                                </h2>
                                <p className="text-gray-600 max-w-2xl mx-auto">
                                    Esta herramienta genera un banner fotorrealista horizontal con artesanías mexicanas, 
                                    mapa de México prominente y estilo colorido profesional.
                                </p>
                            </div>

                            <div className="mb-8 bg-blue-50 border-l-4 border-blue-500 p-4 rounded">
                                <h3 className="font-bold text-blue-900 mb-2">✨ Elementos incluidos:</h3>
                                <ul className="text-blue-800 space-y-1 text-sm">
                                    <li>• Cerámica Talavera colorida y tradicional</li>
                                    <li>• Textiles bordados y sarapes vibrantes</li>
                                    <li>• Figuras de madera tallada (alebrijes)</li>
                                    <li>• Mapa de México en turquesa destacado</li>
                                    <li>• Ambiente artesanal auténtico</li>
                                    <li>• Sin texto en la imagen</li>
                                </ul>
                            </div>

                            <div className="text-center mb-8">
                                <button
                                    onClick={generateImage}
                                    disabled={loading}
                                    className="bg-gradient-to-r from-orange-500 to-pink-600 text-white px-8 py-4 rounded-lg text-lg font-bold hover:from-orange-600 hover:to-pink-700 transition-all transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed shadow-lg"
                                >
                                    {loading ? (
                                        <span className="flex items-center justify-center">
                                            <svg className="animate-spin h-5 w-5 mr-3" viewBox="0 0 24 24">
                                                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none"></circle>
                                                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                            </svg>
                                            Generando imagen...
                                        </span>
                                    ) : (
                                        "🎨 Generar Banner"
                                    )}
                                </button>
                            </div>

                            {error && (
                                <div className="mb-8 bg-red-50 border-l-4 border-red-500 p-4 rounded">
                                    <p className="text-red-800">{error}</p>
                                    <p className="text-red-600 text-sm mt-2">
                                        Nota: Esta funcionalidad requiere acceso al API de Anthropic. 
                                        Como alternativa, puedo ayudarte a crear el banner de otras formas.
                                    </p>
                                </div>
                            )}

                            {generatedImage && (
                                <div className="mt-8">
                                    <h3 className="text-2xl font-bold text-gray-800 mb-4 text-center">
                                        ✅ Banner Generado
                                    </h3>
                                    <div className="bg-gray-100 p-4 rounded-lg">
                                        <img 
                                            src={`data:image/png;base64,${generatedImage}`}
                                            alt="Banner de artesanías mexicanas"
                                            className="w-full rounded-lg shadow-lg"
                                        />
                                    </div>
                                    <div className="mt-4 text-center">
                                        <a
                                            href={`data:image/png;base64,${generatedImage}`}
                                            download="banner-artesanias-mexicanas.png"
                                            className="inline-block bg-green-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-green-700 transition-all"
                                        >
                                            ⬇️ Descargar Banner
                                        </a>
                                    </div>
                                </div>
                            )}

                            <div className="mt-12 bg-gradient-to-r from-orange-100 to-pink-100 p-6 rounded-lg">
                                <h3 className="font-bold text-gray-800 mb-3">💡 Opciones alternativas:</h3>
                                <div className="text-gray-700 space-y-2">
                                    <p>Si esta herramienta no funciona directamente, puedo ayudarte a:</p>
                                    <ul className="list-disc list-inside space-y-1 ml-4">
                                        <li>Crear un diseño SVG ilustrado del banner</li>
                                        <li>Proporcionarte el prompt optimizado para usar en otras herramientas de IA (DALL-E, Midjourney, Stable Diffusion)</li>
                                        <li>Diseñar un mockup HTML/CSS del banner con elementos visuales</li>
                                        <li>Darte especificaciones técnicas para un diseñador</li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<BannerGenerator />, document.getElementById('root'));
    </script>
</body>
</html>
