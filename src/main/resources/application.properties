spring.application.name=ecommerce

#Linea que indica la url del servidor de mysql
spring.datasource.url=jdbc:mysql://${PROD_DB_HOST:localhost:3306}/${PROD_DB_NAME:ch63db}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${PROD_DB_USERNAME:root}
spring.datasource.password=${PROD_DB_PASSWORD:ERPeli7_}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#create-drop solo recomendada para desarrollo
spring.jpa.hibernate.ddl-auto=${PROD_DB_DDL}
#para visualizar las consultas sql que se realizan
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true