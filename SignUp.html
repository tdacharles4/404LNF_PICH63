<!DOCTYPE html>

<html lang="es">

<head>

  <!-- Requisitos. -->
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1" name="viewport" />
  <title>MIXA | ARTESANÍAS - Registro</title>

  <!-- Bootstrap CSS. -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons. -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- FontAwesome Icons. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- CSS Propio. -->
  <link href="../css/styles.css" rel="stylesheet" />

  <!-- JS Components. -->
  <script defer type="module" src="/src/layouts/Navbar.js"></script>
  <script defer type="module" src="/src/layouts/Footer.js"></script>
  <script defer type="module" src="/src/layouts/Carrito.js"></script>

  <!-- JS Functions. -->
  <script defer type="module" src="JavaScript/app.js"></script>
  <!-- Validación de datos de formulario -->
  <script defer type="module" src="JavaScript/signup-form-check.js"> </script>

</head>

<body>
  <div id="navbar"></div>

  <!--Carrito 06/02-->
  <shopping-cart></shopping-cart>
  <!--Carrito 06/02-->


  <main class="container my-4">
    <h2 class="section-title mb-1">Página de registro</h2>
    <div class="section-subtitle mb-4">Crea tu cuenta en MIXE</div>
    <div class="row g-3 justify-content-center">
      <div class="col-12 col-lg-7">
        <div class="card p-4">
          <form id="PaginaRegistro" class="needs-validation" novalidate="">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Nombre</label>
                <input class="form-control" name="nombre" type="text" required placeholder="Ejemplo: Juan">
                <div class="invalid-feedback">Pon tu nombre.</div>
              </div>
              <div class="col-md-6">
                <label class="form-label">Apellido</label>
                <input class="form-control" name="apellido" type="text" required placeholder="Pérez">
                <div class="invalid-feedback">Pon tu apellido.</div>
              </div>
              <div class="col-12">
                <label class="form-label">Correo</label>
                <input class="form-control" name="correo" required type="email" placeholder="nombre@ejemplo.com">
                <div class="invalid-feedback">Pon un correo válido.</div>
              </div>
              <div class="col-12">
                <label class="form-label">Teléfono</label>
                <input class="form-control" required type="tel" placeholder="123-456-7890" id="phone-input" minlength="12">
                <div class="invalid-feedback">Pon un número válido.</div>
                </div> <!-- Correccion cierre div -->
              <div class="col-md-6">
                <label class="form-label">Contraseña</label>
                <input class="form-control" name="password" minlength="6" required type="password">
                <div class="invalid-feedback">Mínimo 6 caracteres.</div>
              </div>
              <div class="col-md-6">
                <label class="form-label">Confirmar contraseña</label>
                <input class="form-control" name="confirmPassword" minlength="6" required type="password">
                <div class="invalid-feedback">Confirma tu contraseña.</div>
              </div>
            </div>
            <button id="BotonF" class="btn btn-outline-mixe mt-3" type="submit">Crear cuenta</button>
            <a id="BotonF2" class="btn btn-outline-mixe mt-3 ms-2" href="../Inicio de sesión/index.html">Ya tengo
              cuenta</a>
          </form>
          <!-- Vista previa JSON -->
          <div id="jsonPreview" class="mt-4 d-none">
            <h5 class="text-success">
              <i class="bi bi-check-circle me-2"></i>Usuario Creado
            </h5>
            <p class="text-muted small">Modelo de datos generado:</p>
            <pre class="bg-light p-3 rounded border"><code id="jsonOutput"></code></pre>
          </div>
          <!-- Vista previa JSON -->
        </div> 
        </div>
      </div>
    </div>
  </main>
  <script src="/src/layouts/Footer.js"></script>
  <footer id="footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script defer="defer" src="../JavaScript/app.js"></script>
</body>

</html>
