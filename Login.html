<!DOCTYPE html>

<html lang="es">
<head>

  <!-- Requisitos. -->
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>MIXA | ARTESANÍAS - Iniciar Sesión</title>

  <!-- Bootstrap CSS. -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Bootstrap Icons. -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <!-- FontAwesome Icons. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- CSS Propio. -->
  <link href="../css/styles.css" rel="stylesheet"/>

  <!-- JS Components. -->
  <script defer type="module" src="/src/layouts/Navbar.js" ></script>
  <script defer type="module" src="/src/layouts/Footer.js"></script>
  <script defer type="module" src="/src/layouts/Carrito.js"></script>

  <!-- JS Functions. -->
  <script defer type="module" src="JavaScript/app.js"></script>
  
</head>

<body>
  <div id="navbar"></div>

  <!--Carrito 06/02-->
  <shopping-cart></shopping-cart>
  <!--Carrito 06/02-->

  <main class="container my-4">
    <h2 class="section-title mb-1">Inicio de sesión</h2>
    <div class="section-subtitle mb-4">Accede a tu cuenta</div>
    <div class="row g-3 justify-content-center">
      <div class="col-12 col-lg-6">
        <div class="card p-4">
          <form class="needs-validation" novalidate="">
            <div class="mb-3">
              <label class="form-label">Correo</label>
              <input class="form-control" required="" type="email"/>
              <div class="invalid-feedback">Pon un correo válido.</div>
            </div>
            <div class="mb-3">
              <label class="form-label">Contraseña</label>
              <input class="form-control" required="" type="password"/>
              <div class="invalid-feedback">Pon tu contraseña.</div>
            </div>
            <button class="btn btn-outline-mixe" type="submit">Iniciar sesión</button>
            <a class="btn btn-outline-mixe ms-2" href="../Página de Registro/index.html">Crear cuenta</a>
            <div class="small text-secondary mt-3">
              (Más adelante aquí metemos “Olvidé mi contraseña”.)
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="/src/layouts/Footer.js"></script>
  <footer id="footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script defer="defer" src="../JavaScript/app.js"></script>
</body>
</html>
