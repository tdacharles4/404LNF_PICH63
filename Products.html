<!DOCTYPE html>

<html lang="es">
<head>

  <!-- Requisitos. -->
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>MIXA | ARTESANÍAS - Catálogo</title>

  <!-- Bootstrap CSS. -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Bootstrap Icons. -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <!-- FontAwesome Icons. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- CSS Propio. -->
  <link href="../css/styles.css" rel="stylesheet"/>

  <!-- JS Components. -->
  <script defer type="module" src="/src/layouts/Navbar.js" ></script>
  <script defer type="module" src="/src/layouts/Footer.js"></script>
  <script defer type="module" src="/src/layouts/Carrito.js"></script>

  <!-- JS Functions. -->
  <script defer type="module" src="JavaScript/app.js"></script>
  
</head>

<body>
  <div id="navbar"></div>

  <!--Carrito 06/02-->
  <shopping-cart></shopping-cart>
  <!--Carrito 06/02-->


  <main class="container my-4">
    <div class="d-flex justify-content-between align-items-end flex-wrap gap-2">
      <div>
        <h2 class="section-title mb-1">Catálogo de productos</h2>
        <div class="section-subtitle">Filtra por material y región</div>
      </div>
      <div class="d-flex gap-2">
        <input class="form-control" id="catalogSearch" placeholder="Buscar (ej. talavera, textil)" style="min-width: 240px;"/>
        <select class="form-select" style="min-width: 220px;">
          <option>Ordenar: más recientes</option>
          <option>Precio: menor a mayor</option>
          <option>Precio: mayor a menor</option>
        </select>
      </div>
    </div>
    <div class="row g-3 mt-2">
      <!-- Filtros -->
      <aside class="col-12 col-lg-3">
        <div class="card p-3 filters">
          <h5 class="mb-3">Filtros</h5>
          <div class="mb-3">
            <div class="fw-bold mb-2">Material</div>
            <div class="form-check"><input class="form-check-input" id="mat1" type="checkbox"/><label class="form-check-label" for="mat1">Cerámica</label></div>
            <div class="form-check"><input class="form-check-input" id="mat2" type="checkbox"/><label class="form-check-label" for="mat2">Madera</label></div>
            <div class="form-check"><input class="form-check-input" id="mat3" type="checkbox"/><label class="form-check-label" for="mat3">Textiles</label></div>
            <div class="form-check"><input class="form-check-input" id="mat4" type="checkbox"/><label class="form-check-label" for="mat4">Cestería</label></div>
          </div>
          <div class="mb-3">
            <div class="fw-bold mb-2">Región</div>
            <select class="form-select">
              <option>Todos</option>
              <option>Oaxaca</option>
              <option>Chiapas</option>
              <option>Puebla</option>
              <option>Michoacán</option>
            </select>
          </div>
          <button class="btn btn-mixe w-100">Aplicar</button>
          <button class="btn btn-outline-mixe w-100 mt-2">Limpiar</button>
        </div>
      </aside>
      <!-- Grid productos -->
      <section class="col-12 col-lg-9">
        <div class="row g-3" id="cardsContainer"></div>
          
        <nav aria-label="Paginación" class="mt-4">
          <ul class="pagination">
            <li class="page-item disabled"><a class="page-link">Anterior</a></li>
            <li class="page-item active"><a class="page-link" href="#">1</a></li>
            <li class="page-item"><a class="page-link" href="#">2</a></li>
            <li class="page-item"><a class="page-link" href="#">3</a></li>
            <li class="page-item"><a class="page-link" href="#">Siguiente</a></li>
          </ul>
        </nav>
      </section>
    </div>
  </main>
  <script src="/src/layouts/Footer.js"></script>
  <footer id="footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script defer="defer" src="../JavaScript/app.js"></script>
</body>
</html>
