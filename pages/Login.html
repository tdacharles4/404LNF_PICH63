  <main class="container my-4">
    <h2 class="section-title mb-1">Inicio de sesión</h2>
    <div class="section-subtitle mb-4">Accede a tu cuenta</div>
    <div class="row g-3 justify-content-center">
      <div class="col-12 col-lg-6">
        <div class="card p-4">
          <form class="needs-validation" novalidate="">
            <div class="mb-3">
              <label class="form-label">Correo</label>
              <input class="form-control" required="" type="email"/>
              <div class="invalid-feedback">Pon un correo válido.</div>
            </div>
            <div class="mb-3">
              <label class="form-label">Contraseña</label>
              <input class="form-control" required="" type="password"/>
              <div class="invalid-feedback">Pon tu contraseña.</div>
            </div>
            <button class="btn btn-mixe" type="submit">Iniciar sesión</button>
            <a class="btn btn-outline-mixe ms-2" href="../Página de Registro/index.html">Crear cuenta</a>
            <div class="small text-secondary mt-3">
              (Más adelante aquí metemos “Olvidé mi contraseña”.)
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>
  <footer id="footer"></footer>
