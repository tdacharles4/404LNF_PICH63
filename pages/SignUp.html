<!DOCTYPE html>

<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>MIXA | ARTESANÍAS - Registro</title>
  <script src="../navbar.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="../css/styles.css" rel="stylesheet"/>
</head>
<body>
  <div id="navbar"></div>
  <main class="container my-4">
    <h2 class="section-title mb-1">Página de registro</h2>
    <div class="section-subtitle mb-4">Crea tu cuenta en MIXE</div>
    <div class="row g-3 justify-content-center">
      <div class="col-12 col-lg-7">
        <div class="card p-4">
          <form class="needs-validation" novalidate="">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Nombre</label>
                <input class="form-control" required=""/>
                <div class="invalid-feedback">Pon tu nombre.</div>
              </div>
              <div class="col-md-6">
                <label class="form-label">Apellido</label>
                <input class="form-control" required=""/>
                <div class="invalid-feedback">Pon tu apellido.</div>
              </div>
              <div class="col-12">
                <label class="form-label">Correo</label>
                <input class="form-control" required="" type="email"/>
                <div class="invalid-feedback">Pon un correo válido.</div>
              </div>
              <div class="col-md-6">
                <label class="form-label">Contraseña</label>
                <input class="form-control" minlength="6" required="" type="password"/>
                <div class="invalid-feedback">Mínimo 6 caracteres.</div>
              </div>
              <div class="col-md-6">
                <label class="form-label">Confirmar contraseña</label>
                <input class="form-control" minlength="6" required="" type="password"/>
                <div class="invalid-feedback">Confirma tu contraseña.</div>
              </div>
            </div>
            <button class="btn btn-mixe mt-3" type="submit">Crear cuenta</button>
            <a class="btn btn-outline-mixe mt-3 ms-2" href="../Inicio de sesión/index.html">Ya tengo cuenta</a>
          </form>
        </div>
      </div>
    </div>
  </main>
  <footer class="mt-5 py-4">
    <div class="container small d-flex justify-content-between flex-wrap gap-2">
      <div>© MIXE | ARTESANÍAS</div>
      <div><a href="../Inicio de sesión/index.html">Iniciar sesión</a></div>
    </div>
  </footer>
  <script defer="defer" src="../JavaScript/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="../styles.css">
  <script defer="defer" src="../JavaScript/app.js"></script>
</body>
</html>
